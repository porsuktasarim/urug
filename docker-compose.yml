services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "1207"
    environment:
      - PORT=1207
      - ACTIVE_LOCALE=tr
      - MONGO_URI=mongodb://mongo:27017/urug
      - TC_ENCRYPTION_KEY=${TC_ENCRYPTION_KEY}
      - TC_HMAC_SECRET=${TC_HMAC_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - BASE_URL=${BASE_URL}
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1207/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - urug-mongo-data:/data/db

volumes:
  urug-mongo-data:
